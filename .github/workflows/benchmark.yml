name: Runtime benchmark telemetry

on:
  pull_request:
  schedule:
    - cron: "17 3 * * *"
    - cron: "47 3 * * 0"
  workflow_dispatch:
    inputs:
      tier:
        description: Benchmark tier
        required: true
        default: pr
        type: choice
        options: [pr, nightly, weekly]

permissions:
  contents: read

concurrency:
  group: benchmark-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-smoke:
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && inputs.tier == 'pr')
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - run: uv sync --locked --group dev
      - name: Run 1k smoke telemetry
        run: >-
          uv run --locked python scripts/benchmark_runtime.py run
          --sizes 1000 --repetitions 1 --warmups 0
          --output artifacts/benchmark-pr-1k.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: benchmark-pr-1k
          path: artifacts/benchmark-pr-1k.json
          if-no-files-found: ignore
          retention-days: 14

  nightly:
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '17 3 * * *') ||
      (github.event_name == 'workflow_dispatch' && inputs.tier == 'nightly')
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - run: uv sync --locked --group dev
      - name: Run 1k and 10k telemetry
        run: >-
          uv run --locked python scripts/benchmark_runtime.py run
          --sizes 1000,10000 --repetitions 5 --warmups 1
          --output artifacts/benchmark-nightly.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: benchmark-nightly
          path: artifacts/benchmark-nightly.json
          if-no-files-found: ignore
          retention-days: 30

  weekly:
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '47 3 * * 0') ||
      (github.event_name == 'workflow_dispatch' && inputs.tier == 'weekly')
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - run: uv sync --locked --group dev
      - name: Run 100k telemetry
        run: >-
          uv run --locked python scripts/benchmark_runtime.py run
          --sizes 100000 --repetitions 3 --warmups 1
          --output artifacts/benchmark-weekly-100k.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: benchmark-weekly-100k
          path: artifacts/benchmark-weekly-100k.json
          if-no-files-found: ignore
          retention-days: 30
