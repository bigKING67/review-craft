[project]
name = "review-craft-dev"
version = "0.6.2"
description = "Development tooling for Review Craft"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
  "jsonschema>=4.23,<5",
  "ruff>=0.12,<1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["evals/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
